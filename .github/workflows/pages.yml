# Checks the website on every push and deploys it to GitHub Pages from main.
# Setup: Settings -> Pages -> Source: GitHub Actions.
# Reference: GitHub (2025) Using custom workflows with GitHub Pages - https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

name: Website checks and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HTML, JavaScript and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@9 "*.html"

      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done

      - name: Check local links and assets exist
        run: node .github/scripts/check-links.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only the site itself (not the workflow, README or other repo files).
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html css js images _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
