<!DOCTYPE html>
<!-- Sign in with Google or email/password, or create a customer account. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://*.azurewebsites.net https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com">
  <title>Sign in - Legacies Screen Printers</title>
  <link rel="icon" href="images/LegaciesSP_Image.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="public">
  <header id="siteHeader"></header>

  <main class="auth-layout">
    <section class="auth-welcome">
      <p class="muted">LEGACIES SCREEN PRINTERS</p>
      <h1>Good work starts with a great impression.</h1>
      <p>Customers: place print orders and follow them through production. Staff: manage orders, customers and stock. One account works here and in the Android app.</p>
    </section>

    <section class="card" aria-labelledby="authTitle">
      <h2 id="authTitle">Sign in to your account</h2>
      <p id="sessionMessage" class="status info" role="status"></p>

      <!-- Google single sign-on: the same Google account as in the app -->
      <div id="googleButton" aria-live="polite"></div>
      <p id="googleStatus" class="status info"></p>

      <div class="divider">or use your email</div>

      <div class="tabs" role="tablist">
        <button id="tabSignIn" type="button" role="tab" aria-selected="true" aria-controls="loginForm">Sign in</button>
        <button id="tabRegister" type="button" role="tab" aria-selected="false" aria-controls="registerForm">Create account</button>
      </div>

      <form id="loginForm" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div class="actions"><button class="full-width" type="submit">Sign in</button></div>
      </form>

      <form id="registerForm" hidden novalidate>
        <label for="regName">Full name</label>
        <input id="regName" type="text" autocomplete="name" required maxlength="100">

        <label for="regPhone">Contact number</label>
        <input id="regPhone" type="tel" autocomplete="tel" required maxlength="20">

        <label for="regEmail">Email address</label>
        <input id="regEmail" type="email" autocomplete="email" required maxlength="120">

        <label for="regPassword">Password (at least 6 characters)</label>
        <input id="regPassword" type="password" autocomplete="new-password" required minlength="6">

        <div class="actions"><button class="full-width" type="submit">Create account</button></div>
      </form>

      <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
