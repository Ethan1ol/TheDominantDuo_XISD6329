<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management - Legacies Screen Printers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo-container">
    <img src="images\LegaciesSP_Image.jpg" alt="Legacies Logo Icon" class="nav-logo"><span class="logo-text">Legacies Screen Printers</span>
    </div>
 
    <nav class="nav">
      <a href="index.html">Dashboard</a>
      <a href="customers.html">Customers</a>
      <a href="orders.html">Orders</a>
      <a href="inventory.html">Inventory</a>
    </nav>
  </header>

  <h1>Inventory Management</h1>
  <main class="container">

    <section class="card">
      <h2>Add Inventory Item</h2>
      <input id="itemName" placeholder="Item Name" required>
      <input id="stockLevel" type="number" min="0" step="1" placeholder="Stock Quantity" required>
      <input id="itemPrice" type="number" min="0" step="0.01" placeholder="Price" required>
      <button onclick="addInventory()">Add Item</button>
    </section>

    <section class="card full">
      <h2>Current Inventory</h2>
      <div id="inventoryTable"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Legacies Screen Printers. All Rights Reserved.</p>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/liveOrder.js"></script>
  <script src="js/inventory.js"></script>
  <script>
    showInventoryTable();
  </script>
</body>
</html>
