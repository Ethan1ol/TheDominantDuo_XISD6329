<!DOCTYPE html>
<!-- Staff: vinyl stock levels, low-stock alerts, adding materials and adjusting stock. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; connect-src 'self' https://*.azurewebsites.net; img-src 'self' data:">
  <title>Inventory - Legacies Screen Printers staff</title>
  <link rel="icon" href="images/LegaciesSP_Image.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="staff">
  <header id="siteHeader"></header>

  <main>
    <h1>Inventory</h1>
    <p class="page-intro">Stock goes down automatically when an order is placed. Record deliveries and corrections here; materials at or below their threshold are flagged.</p>

    <section class="card">
      <h2>Current stock</h2>
      <p id="inventoryStatus" class="status" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="responsive">
          <thead>
            <tr><th>ID</th><th>Material</th><th>Colour</th><th class="num">Price</th><th class="num">In stock</th><th class="num">Alert at</th><th>Status</th><th>Adjust stock</th></tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Add a material</h2>
      <form id="addMaterialForm" novalidate>
        <div class="form-row cols-2-1-1">
          <div><label for="matName">Material name</label><input type="text" id="matName" required maxlength="100" placeholder="e.g. Glitter Vinyl"></div>
          <div><label for="matColor">Colour</label><input type="text" id="matColor" required maxlength="50" placeholder="e.g. Rose Gold"></div>
          <div><label for="matUnit">Unit</label><input type="text" id="matUnit" value="meters" maxlength="20"></div>
        </div>
        <div class="form-row cols-3">
          <div><label for="matPrice">Price per unit (R)</label><input id="matPrice" type="number" min="0.01" step="0.01" required></div>
          <div><label for="matStock">Opening stock</label><input id="matStock" type="number" min="0" step="1" value="0" required></div>
          <div><label for="matThreshold">Low-stock alert at</label><input id="matThreshold" type="number" min="0" step="1" value="15" required></div>
        </div>
        <div class="actions"><button type="submit">Add material</button></div>
      </form>
      <p id="addMaterialStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
