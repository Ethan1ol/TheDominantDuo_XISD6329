<!DOCTYPE html>
<!-- My orders: the customer's orders from the web and app, with the production timeline. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; connect-src 'self' https://*.azurewebsites.net; img-src 'self' data:">
  <title>My orders - Legacies Screen Printers</title>
  <link rel="icon" href="images/LegaciesSP_Image.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="customer">
  <header id="siteHeader"></header>

  <main>
    <h1>My orders</h1>
    <p class="page-intro">Orders you've placed on this site or in the Legacies app. Select one to see where it is in production.</p>

    <section class="card">
      <div class="actions toolbar">
        <h2 class="flush">Order history</h2>
        <button id="refresh" type="button" class="button-secondary button-small">Refresh</button>
      </div>
      <p id="listStatus" class="status" role="status"></p>
      <div class="table-wrap">
        <table class="responsive">
          <thead>
            <tr><th>Reference</th><th>Placed</th><th>Via</th><th>Status</th><th class="num">Total</th><th><span class="visually-hidden">View</span></th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="detail">
      <h2>Order progress</h2>
      <p id="detailStatus" class="status info" role="status">Select an order above.</p>
      <div id="detailBody"></div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/orderTrack.js"></script>
  <script src="js/myOrders.js"></script>
</body>
</html>
