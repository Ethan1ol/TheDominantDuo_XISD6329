<!DOCTYPE html>
<!-- Staff view of every order (app, website and walk-in) with the production stage control. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; connect-src 'self' https://*.azurewebsites.net; img-src 'self' data:">
  <title>Orders - Legacies Screen Printers staff</title>
  <link rel="icon" href="images/LegaciesSP_Image.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="staff">
  <header id="siteHeader"></header>

  <main>
    <h1>Orders</h1>
    <p class="page-intro">Every order from the app, the website and the counter. Changing an order's stage updates what the customer sees in the app and on the website straight away.</p>

    <section class="card">
      <div class="form-row cols-1-1-auto">
        <div>
          <label for="filterStatus">Show</label>
          <select id="filterStatus">
            <option value="open">Still in production</option>
            <option value="all">All orders</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div>
          <label for="filterText">Search reference or customer</label>
          <input id="filterText" type="search" placeholder="e.g. ORD5824 or Demo">
        </div>
        <button id="refreshOrders" type="button" class="button-secondary">Refresh</button>
      </div>
      <p id="ordersStatus" class="status" role="status" aria-live="polite"></p>

      <div class="table-wrap mt-sm">
        <table class="responsive">
          <thead>
            <tr><th>Reference</th><th>Customer</th><th>Via</th><th>Items</th><th class="num">Total</th><th>Production stage</th><th>Placed</th></tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/liveOrder.js"></script>
</body>
</html>
