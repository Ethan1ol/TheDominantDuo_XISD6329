<!DOCTYPE html>
<!-- Staff: customer list and search, add a customer, record a phone or walk-in order. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; connect-src 'self' http://localhost:5000 https://*.azurewebsites.net; img-src 'self' data:">
  <title>Customers - Legacies Screen Printers staff</title>
  <link rel="icon" href="images/LegaciesSP_Image.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-portal="staff">
  <header id="siteHeader"></header>

  <main>
    <h1>Customers</h1>
    <p class="page-intro">Find a customer, add someone who phoned or walked in, and record their order at the counter.</p>

    <div class="grid grid-2 align-start">
      <section class="card">
        <h2>Add a customer</h2>
        <form id="addCustomerForm" novalidate>
          <label for="custFullName">Full name</label>
          <input type="text" id="custFullName" required maxlength="100">
          <label for="custContact">Contact number</label>
          <input id="custContact" type="tel" required maxlength="20">
          <label for="custEmail">Email</label>
          <input id="custEmail" type="email" required maxlength="120">
          <label for="custPassword">Temporary password (give it to the customer to change)</label>
          <div class="form-row cols-1-auto">
            <input id="custPassword" type="text" required minlength="6" autocomplete="off">
            <button id="generatePassword" type="button" class="button-secondary">Generate</button>
          </div>
          <div class="actions"><button type="submit">Add customer</button></div>
        </form>
        <p id="addStatus" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card" id="walkInCard">
        <h2>Phone or walk-in order</h2>
        <form id="walkInOrderForm" novalidate>
          <label for="walkInCustomer">Customer</label>
          <select id="walkInCustomer" required><option value="">Loading customers...</option></select>
          <label for="walkInDesign">Design name or description</label>
          <input type="text" id="walkInDesign" required maxlength="100" placeholder="e.g. Shop window lettering">
          <div class="form-row cols-3-1">
            <div>
              <label for="walkInMaterialSelect">Vinyl material</label>
              <select id="walkInMaterialSelect" required><option value="">Loading materials...</option></select>
            </div>
            <div>
              <label for="walkInQty">Quantity</label>
              <input id="walkInQty" type="number" min="1" step="1" value="1" required>
            </div>
          </div>
          <div class="order-total"><span>Total</span><strong id="walkInTotalDisplay">R 0.00</strong></div>
          <div class="actions"><button type="submit">Create walk-in order</button></div>
        </form>
        <p id="walkInStatus" class="status" role="status" aria-live="polite"></p>
      </section>
    </div>

    <section class="card mt">
      <div class="form-row cols-1-auto">
        <div>
          <label for="searchCustomerInput">Search by name, email or phone</label>
          <input id="searchCustomerInput" type="search" placeholder="Start typing...">
        </div>
        <button id="showAllCustomersBtn" type="button" class="button-secondary">Show all</button>
      </div>
      <p id="listStatus" class="status" role="status"></p>
      <div class="table-wrap mt-sm">
        <table class="responsive">
          <thead><tr><th>ID</th><th>Name</th><th>Contact</th><th>Email</th><th>Role</th><th>Joined</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
          <tbody id="customersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/customerSearch.js"></script>
</body>
</html>
